name: "Skills Hub — Evaluate"
description: "Run skill evaluations against rubrics and commit traces."

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.12"
  rerun:
    description: "Re-run all scenarios even if traces exist"
    required: false
    default: "false"
  api-key-secret:
    description: "Name of the secret containing the API key (passed as env var)"
    required: false
    default: "OPENROUTER_API_KEY"

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install skill-eval
      shell: bash
      # Installed from this action's own downloaded copy of the repo so it
      # works while skills-hub is a private repository.
      run: uv pip install "${{ github.action_path }}/../../packages/skill-eval"

    - name: Run evaluations
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key-secret }}
      run: |
        ARGS="-v -s"
        if [ "${{ inputs.rerun }}" = "true" ]; then
          ARGS="$ARGS --rerun"
        fi
        uv run pytest tests/ $ARGS || true

    - name: Rebuild trace index
      shell: bash
      run: uv run skill-eval index
