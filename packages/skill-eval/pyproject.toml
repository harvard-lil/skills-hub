[project]
name = "skill-eval"
version = "0.1.0"
description = "LLM-as-judge evaluation harness for AI agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
parallel = ["pytest-xdist>=3.5"]

[project.scripts]
skill-eval = "skill_eval.cli:main"

[project.entry-points.pytest11]
skill_eval = "skill_eval.conftest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_eval"]
