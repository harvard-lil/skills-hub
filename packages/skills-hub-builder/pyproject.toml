[project]
name = "skills-hub-builder"
version = "0.3.0"
description = "Static site generator for publishing curated collections of AI agent skills"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
skills-hub-builder = "skills_hub_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skills_hub_builder"]
