{% extends "_base.html" %}

{% block content %}
    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <h1>{{ site.title }}</h1>
            {% if site.subtitle %}
            <p class="hero-text">{{ site.subtitle }}</p>
            {% endif %}
            <div class="hero-actions">
                <a href="#groups" class="btn btn-primary">Browse Skills &darr;</a>
                {% if repo_url %}
                <a href="{{ repo_url }}" class="btn btn-secondary" target="_blank">GitHub &rarr;</a>
                {% endif %}
            </div>
        </div>
    </section>

    <!-- Skills Section -->
    <section id="groups" class="groups-section">
        <div class="container">
            <div class="section-header">
                <h2>SKILLS</h2>
                <div class="filters">
                    <button class="filter-btn active" data-filter="all">ALL</button>
                </div>
            </div>

            <div id="groups-container">
                <p class="loading-msg">Loading skills inventory&hellip;</p>
            </div>
        </div>
    </section>
{% endblock %}

{% block scripts %}
    <script src="{{ root }}js/app.js"></script>
{% endblock %}
